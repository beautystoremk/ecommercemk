{% extends "base.html" %}

{% block title %}Carrito de Compras | BEAUTY STORE{% endblock %}

{% block content %}
<!-- SDK oficial de Mercado Pago Bricks para Tarjetas -->
<script src="https://sdk.mercadopago.com/js/v2"></script>

<div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-mk-lightpink p-6 md:p-8">
    <h1 class="font-serif-mk text-3xl font-bold text-mk-dark mb-6">Tu Carrito de Compras</h1>
    <a href="/" class="bg-[#a81c4e] hover:bg-[#891440] text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm w-fit mb-6">
        <i class="fa-solid fa-arrow-left"></i> Volver al Catálogo
    </a>
    <div id="cart-container" 
         data-descuento="{{ datos_transferencia.descuento_porcentaje }}"
         data-activo="{{ 'true' if datos_transferencia.transferencia_activo else 'false' }}"
         data-reglas="{{ reglas_envio_json }}"
         data-vol-activo="{{ 'true' if datos_transferencia.descuento_volumen_activo else 'false' }}"
         data-vol-minimo="{{ datos_transferencia.descuento_volumen_minimo }}"
         data-vol-porcentaje="{{ datos_transferencia.descuento_volumen_porcentaje }}">
    </div>
</div>

<script>
    let cuponAplicado = null;
    let mpInstance = null;
    let cardPaymentBrickController = null;
    let brickInitialized = false; // 👈 Bandera para inicializar el Brick una sola vez sin errores

    function loadCart() {
        const container = document.getElementById('cart-container');
        const DESCUENTO_PORCENTAJE = parseFloat(container.getAttribute('data-descuento')) || 10;
        const TRANSFERENCIA_ACTIVA = container.getAttribute('data-activo') === 'true';
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        if (typeof updateCartCounter === 'function') {
            updateCartCounter();
        }

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12">
                    <p class="text-gray-500 text-sm mb-4">Tu carrito está vacío.</p>
                    <a href="/" class="inline-block bg-mk-dark text-white text-xs font-bold px-6 py-3 rounded-xl hover:bg-mk-deep transition">Volver al Catálogo</a>
                </div>
            `;
            return;
        }

        let html = `<div class="divide-y divide-gray-100 mb-6">`;
        let subtotalGeneral = 0;

        cart.forEach((item, index) => {
            let subtotal = item.precio * item.cantidad;
            subtotalGeneral += subtotal;
            html += `
                <div class="py-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <img src="${item.imagen_url}" class="w-16 h-16 object-contain bg-mk-softgray p-1 rounded-lg border">
                        <div>
                            <h3 class="font-bold text-sm text-mk-dark">${item.nombre}</h3>
                            <p class="text-xs text-gray-500">$${item.precio.toLocaleString('es-AR', {minimumFractionDigits: 2})} c/u</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button type="button" onclick="changeQty(${index}, -1)" class="bg-gray-100 px-2.5 py-1 rounded text-xs font-bold">-</button>
                        <span class="text-xs font-bold">${item.cantidad}</span>
                        <button type="button" onclick="changeQty(${index}, 1)" class="bg-gray-100 px-2.5 py-1 rounded text-xs font-bold">+</button>
                        <span class="text-sm font-bold text-mk-dark w-24 text-right">$${subtotal.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
                        <button type="button" onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        html += `
            <div id="banner-publicidad-volumen" class="mb-6 hidden"></div>
        `;

        html += `
            <div class="bg-mk-lightpink/30 p-4 rounded-xl border border-mk-pink mb-6">
                <label class="block text-xs font-bold text-mk-dark uppercase mb-2">¿Tienes un cupón de descuento?</label>
                <div class="flex gap-2">
                    <input type="text" id="input-cupon" placeholder="Ej: MARYKAY10" class="uppercase text-xs p-3 rounded-xl border border-gray-200 focus:border-mk-pink focus:outline-none flex-grow bg-white font-bold">
                    <button type="button" onclick="aplicarCupon()" class="bg-mk-dark hover:bg-mk-deep text-white text-xs font-bold px-5 py-3 rounded-xl transition shadow-sm">
                        Aplicar
                    </button>
                </div>
                <div id="msg-cupon" class="text-xs font-bold mt-2 hidden"></div>
            </div>
        `;

        html += `
            <div class="bg-mk-softgray p-6 rounded-xl border border-mk-pink mb-8 space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">Subtotal Productos:</span>
                    <span class="font-bold text-mk-dark" id="resumen-subtotal">$${subtotalGeneral.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
                </div>
                <div id="row-descuento-cupon" class="flex justify-between text-sm text-green-700 font-bold hidden">
                    <span>Descuento Cupón (<span id="txt-codigo-cupon"></span>):</span>
                    <span id="resumen-cupon">-$0.00</span>
                </div>
                <div id="row-descuento-volumen" class="flex justify-between text-sm text-mk-deep font-bold hidden">
                    <span>Descuento por Volumen (<span id="txt-vol-porcentaje"></span>% OFF):</span>
                    <span id="resumen-descuento-volumen">-$0.00</span>
                </div>
                <div id="row-descuento-transferencia" class="flex justify-between text-sm text-mk-deep font-semibold ${TRANSFERENCIA_ACTIVA ? '' : 'hidden'}">
                    <span>Descuento por Transferencia (${DESCUENTO_PORCENTAJE}% OFF):</span>
                    <span id="resumen-descuento">-$0.00</span>
                </div>
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Costo de Envío:</span>
                    <span id="resumen-envio" class="font-bold text-mk-deep">Calculando...</span>
                </div>
                <div class="border-t border-gray-200 pt-3 flex justify-between text-base font-bold text-mk-dark">
                    <span>Total Final:</span>
                    <span id="resumen-total">$0.00</span>
                </div>
            </div>

            <form action="/checkout" method="POST" class="space-y-6 border-t pt-6" id="form-checkout" onsubmit="prepareCheckout(event)">
                <input type="hidden" name="cart_data" id="cart_data_input">
                <input type="hidden" name="cupon_codigo" id="cupon_codigo_input">

                <h3 class="font-bold text-sm text-mk-dark uppercase tracking-wide">1. Datos de Envío y Contacto</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" id="input_nombre" name="cliente_nombre" placeholder="Nombre Completo" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    <input type="email" id="input_email" name="cliente_email" placeholder="Correo Electrónico" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    <input type="text" id="input_telefono" name="cliente_telefono" placeholder="Teléfono / WhatsApp" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    <input type="text" id="input_dni" name="cliente_dni" placeholder="DNI / CUIT" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    
                    <input type="text" id="input_direccion" name="cliente_direccion" placeholder="Dirección de entrega (Calle y número)" required class="sm:col-span-2 text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    
                    <input type="text" id="input_localidad" name="cliente_localidad" placeholder="Localidad / Departamento (Ej: Luján de Cuyo)" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">
                    
                    <input type="text" id="input_cp" name="cliente_codigo_postal" placeholder="Código Postal (Ej: 5507)" required class="text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none">

                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-mk-dark uppercase mb-1">Provincia de Destino:</label>
                        <select id="cliente_provincia" name="cliente_provincia" onchange="actualizarCostosEnvio()" required class="w-full text-xs p-3 rounded-lg border border-gray-200 focus:border-mk-pink focus:outline-none bg-white font-semibold">
                            {% for env in provincias_envio %}
                            <option value="{{ env.provincia }}">{{ env.provincia }}{% if env.provincia == 'Mendoza' %} (Local / Retiro){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h3 class="font-bold text-sm text-mk-dark uppercase tracking-wide pt-2">2. Medio de Pago</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    <label class="border p-4 rounded-xl flex items-center space-x-2 cursor-pointer hover:border-amber-400 transition bg-amber-50 border-amber-300">
    <input type="radio" name="metodo_pago" value="mercadopago" checked class="text-amber-600 focus:ring-amber-500" onchange="cambiarMetodoPago()">
    <span class="text-xs font-bold text-amber-900">Mercado Pago (Redirección)</span>
</label>
                    <label class="border p-4 rounded-xl flex items-center space-x-2 cursor-pointer hover:border-mk-pink transition bg-mk-lightpink/40">
                        <input type="radio" name="metodo_pago" value="tarjeta_directa" class="text-mk-deep" onchange="cambiarMetodoPago()">
                        <span class="text-xs font-semibold text-mk-deep">💳 Tarjeta Credito/Debito</span>
                    </label>
                    <label class="border p-4 rounded-xl flex items-center space-x-2 cursor-pointer hover:border-mk-pink transition bg-blue-50">
                        <input type="radio" name="metodo_pago" value="qr_modo" class="text-mk-deep" onchange="cambiarMetodoPago()">
                        <span class="text-xs font-semibold text-blue-800">📱 Pago con QR (MODO / Billeteras)</span>
                    </label>
                    <label class="border p-4 rounded-xl flex items-center space-x-2 cursor-pointer hover:border-mk-pink transition bg-emerald-50">
                        <input type="radio" name="metodo_pago" value="transferencia" class="text-mk-deep" onchange="cambiarMetodoPago()">
                        <span class="text-xs font-semibold text-emerald-800">Transferencia ${TRANSFERENCIA_ACTIVA ? `(${DESCUENTO_PORCENTAJE}% OFF)` : ''}</span>
                    </label>
                </div>

                <!-- Contenedor del Formulario de Tarjeta Transparente (Brick) -->
                <div id="cardPaymentBrick_container" class="hidden my-4 p-4 border border-mk-pink rounded-xl bg-mk-softgray"></div>

                <button type="submit" id="btn-submit-compra" class="w-full bg-mk-dark hover:bg-mk-deep text-white font-bold py-4 rounded-xl transition duration-300 shadow-md">
                    Finalizar Compra
                </button>
            </form>
        `;

        container.innerHTML = html;
        actualizarCostosEnvio();
    }

    function cambiarMetodoPago() {
        const metodo = document.querySelector('input[name="metodo_pago"]:checked').value;
        const brickContainer = document.getElementById('cardPaymentBrick_container');
        const submitBtn = document.getElementById('btn-submit-compra');

        if (metodo === 'tarjeta_directa') {
            brickContainer.classList.remove('hidden');
            submitBtn.classList.add('hidden'); // Oculta el botón general porque el Brick tiene el suyo
            
            // Inicializamos de forma segura la primera vez que se selecciona
            if (!brickInitialized) {
                setTimeout(() => {
                    inicializarMercadoPagoBrick();
                }, 50);
            }
        } else {
            brickContainer.classList.add('hidden');
            submitBtn.classList.remove('hidden');
        }
        actualizarCostosEnvio();
    }

    async function inicializarMercadoPagoBrick() {
        const container = document.getElementById('cardPaymentBrick_container');
        if (!container) return;

        // Recalcular el monto exacto actual (incluyendo envío, descuentos o cupones)
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let subtotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
        
        let reglasEnvio = {};
        try {
            reglasEnvio = JSON.parse(document.getElementById('cart-container').getAttribute('data-reglas') || '{}');
        } catch (e) {}
        
        const provincia = document.getElementById('cliente_provincia').value;
        let costoEnvio = 0.0;
        if (reglasEnvio[provincia]) {
            const regla = reglasEnvio[provincia];
            if (regla.gratis_desde !== null && subtotal >= regla.gratis_desde) {
                costoEnvio = 0.0;
            } else {
                costoEnvio = regla.costo;
            }
        }
        let descCupon = cuponAplicado ? cuponAplicado.monto_descuento : 0;
        let totalParaPagar = Math.max(0, subtotal - descCupon) + costoEnvio;

        try {
            if (!mpInstance) {
                const PUBLIC_KEY = 'APP_USR-8b6336b0-78cd-4d98-b74f-cc500aae66be'; 

                mpInstance = new MercadoPago(PUBLIC_KEY, {
                    locale: 'es-AR'
                });
            }

            const bricksBuilder = mpInstance.bricks();
            
            const settings = {
                initialization: {
                    amount: totalParaPagar,
                },
                callbacks: {
                    onReady: () => {
                        console.log("Brick de tarjeta cargado correctamente.");
                        brickInitialized = true;
                    },
                    onSubmit: (cardFormData) => {
                        return new Promise((resolve, reject) => {
                            const nombre = document.getElementById('input_nombre').value;
                            const email = document.getElementById('input_email').value;
                            const telefono = document.getElementById('input_telefono').value;
                            const dni = document.getElementById('input_dni').value;
                            const direccion = document.getElementById('input_direccion').value;
                            const localidad = document.getElementById('input_localidad').value;
                            const cp = document.getElementById('input_cp').value;
                            const provinciaSel = document.getElementById('cliente_provincia').value;

                            if (!nombre || !email || !dni) {
                                alert("Por favor complete sus datos de contacto y DNI antes de pagar con tarjeta.");
                                reject();
                                return;
                            }

                            const formData = new FormData();
                            formData.append('token', cardFormData.token);
                            formData.append('payment_method_id', cardFormData.payment_method_id);
                            formData.append('installments', cardFormData.installments);
                            formData.append('issuer_id', cardFormData.issuer_id || '');
                            formData.append('payer_email', email);
                            formData.append('cart_data', JSON.stringify(cart));
                            formData.append('cliente_nombre', nombre);
                            formData.append('cliente_telefono', telefono);
                            formData.append('cliente_dni', dni);
                            formData.append('cliente_direccion', direccion);
                            formData.append('cliente_localidad', localidad);
                            formData.append('cliente_codigo_postal', cp);
                            formData.append('cliente_provincia', provinciaSel);

                            fetch('/api/procesar-pago-tarjeta', {
                                method: 'POST',
                                body: formData
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.status === 'approved') {
                                    localStorage.removeItem('cart');
                                    window.location.href = `/confirmacion/${data.pedido_id}`;
                                    resolve();
                                } else {
                                    alert("El pago no pudo ser aprobado. Intente con otra tarjeta.");
                                    reject();
                                }
                            })
                            .catch(error => {
                                console.error("Error en el fetch de pago:", error);
                                alert("Hubo un error al procesar el pago con tarjeta.");
                                reject();
                            });
                        });
                    },
                    onError: (error) => { 
                        console.error("Error en Brick de Mercado Pago:", error); 
                    },
                },
            };

            window.cardPaymentBrickController = await bricksBuilder.create(
                'cardPayment',
                'cardPaymentBrick_container',
                settings
            );

        } catch (e) {
            console.error("No se pudo inicializar el Brick de Mercado Pago:", e);
            container.innerHTML = `<p class="text-red-600 text-xs font-bold p-3">Error al cargar el formulario de tarjeta. Verifique su Clave Pública.</p>`;
        }
    }

    async function aplicarCupon() {
        const input = document.getElementById('input-cupon');
        const msg = document.getElementById('msg-cupon');
        const codigo = input ? input.value.trim() : '';

        if (!codigo) return;

        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const subtotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

        const formData = new FormData();
        formData.append('codigo', codigo);
        formData.append('subtotal', subtotal);
        formData.append('cart_items', JSON.stringify(cart));

        try {
            const res = await fetch('/api/cupon/validar', { method: 'POST', body: formData });
            const data = await res.json();

            if (res.ok && data.valido) {
                cuponAplicado = data;
                msg.textContent = data.mensaje;
                msg.className = 'text-xs font-bold mt-2 text-green-600 block';
                actualizarCostosEnvio();
            } else {
                cuponAplicado = null;
                msg.textContent = data.detail || 'Error al validar el cupón.';
                msg.className = 'text-xs font-bold mt-2 text-red-600 block';
                actualizarCostosEnvio();
            }
        } catch (e) {
            msg.textContent = 'Error de conexión con el servidor.';
            msg.className = 'text-xs font-bold mt-2 text-red-600 block';
        }
    }

    function actualizarCostosEnvio() {
        const container = document.getElementById('cart-container');
        let reglasEnvio = {};
        try {
            reglasEnvio = JSON.parse(container.getAttribute('data-reglas') || '{}');
        } catch (e) {
            reglasEnvio = {};
        }

        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const subtotal = cart.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

        let descCupon = 0;
        const rowCupon = document.getElementById('row-descuento-cupon');
        if (cuponAplicado) {
            descCupon = cuponAplicado.monto_descuento;
            document.getElementById('txt-codigo-cupon').innerText = cuponAplicado.codigo;
            document.getElementById('resumen-cupon').innerText = '-$' + descCupon.toLocaleString('es-AR', {minimumFractionDigits: 2});
            rowCupon.classList.remove('hidden');
        } else if (rowCupon) {
            rowCupon.classList.add('hidden');
        }

        const subtotalConCupon = Math.max(0, subtotal - descCupon);

        const volActivo = container.getAttribute('data-vol-activo') === 'true';
        const volMinimo = parseFloat(container.getAttribute('data-vol-minimo')) || 0;
        const volPorcentaje = parseFloat(container.getAttribute('data-vol-porcentaje')) || 0;

        let descVolumen = 0;
        const rowVolumen = document.getElementById('row-descuento-volumen');
        const bannerVolumen = document.getElementById('banner-publicidad-volumen');

        if (volActivo) {
            if (subtotalConCupon >= volMinimo) {
                descVolumen = subtotalConCupon * (volPorcentaje / 100.0);
                if (rowVolumen) {
                    document.getElementById('txt-vol-porcentaje').innerText = volPorcentaje;
                    document.getElementById('resumen-descuento-volumen').innerText = '-$' + descVolumen.toLocaleString('es-AR', {minimumFractionDigits: 2});
                    rowVolumen.classList.remove('hidden');
                }
                if (bannerVolumen) {
                    bannerVolumen.className = 'mb-6 p-4 bg-emerald-50 border-2 border-emerald-500 rounded-2xl text-emerald-800 text-xs text-center font-bold shadow-sm';
                    bannerVolumen.innerHTML = `
                        <p class="text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i> 
                            ¡FELICIDADES! ALCANZASTE EL DESCUENTO POR VOLUMEN
                        </p>
                        <p class="font-normal text-[11px] mt-1 text-emerald-700">
                            Tu compra supera los $${volMinimo.toLocaleString('es-AR', {minimumFractionDigits: 2})} y se le ha aplicado un <strong>${volPorcentaje}% OFF automático</strong>.
                        </p>
                    `;
                }
            } else {
                if (rowVolumen) {
                    rowVolumen.classList.add('hidden');
                }
                if (bannerVolumen) {
                    const falta = volMinimo - subtotalConCupon;
                    bannerVolumen.className = 'mb-6 p-4 bg-mk-lightpink border-2 border-mk-deep rounded-2xl text-mk-dark text-xs text-center font-bold shadow-sm';
                    bannerVolumen.innerHTML = `
                        <p class="text-sm flex items-center justify-center gap-2 text-mk-deep">
                            <i class="fa-solid fa-gift text-lg"></i> 
                            ¡PROMO ${volPorcentaje}% OFF POR VOLUMEN!
                        </p>
                        <p class="font-semibold text-[11px] mt-1 text-gray-700">
                            Agrega <strong>$${falta.toLocaleString('es-AR', {minimumFractionDigits: 2})}</strong> más a tu carrito para superar los $${volMinimo.toLocaleString('es-AR', {minimumFractionDigits: 2})} y obtener un <strong>${volPorcentaje}% de descuento automático</strong> en tu compra.
                        </p>
                    `;
                }
            }
        } else {
            if (rowVolumen) rowVolumen.classList.add('hidden');
            if (bannerVolumen) bannerVolumen.classList.add('hidden');
        }

        const subtotalConVolumen = Math.max(0, subtotalConCupon - descVolumen);

        const provinciaSelect = document.getElementById('cliente_provincia');
        const provincia = provinciaSelect ? provinciaSelect.value : 'Mendoza';
        
        const metodoPagoRadio = document.querySelector('input[name="metodo_pago"]:checked');
        const esTransferencia = metodoPagoRadio && metodoPagoRadio.value === 'transferencia';
        
        const DESCUENTO_PORCENTAJE = parseFloat(container.getAttribute('data-descuento')) || 10;
        const TRANSFERENCIA_ACTIVA = container.getAttribute('data-activo') === 'true';

        let costoEnvio = 0.0;
        const regla = reglasEnvio[provincia];

        if (regla) {
            if (regla.gratis_desde !== null && subtotalConVolumen >= regla.gratis_desde) {
                costoEnvio = 0.0;
            } else {
                costoEnvio = regla.costo;
            }
        }

        const descuentoTransf = (esTransferencia && TRANSFERENCIA_ACTIVA) ? subtotalConVolumen * (DESCUENTO_PORCENTAJE / 100) : 0.0;
        const totalFinal = (subtotalConVolumen - descuentoTransf) + costoEnvio;

        document.getElementById('resumen-subtotal').innerText = '$' + subtotal.toLocaleString('es-AR', {minimumFractionDigits: 2});
        
        const resumenDescuentoEl = document.getElementById('resumen-descuento');
        if (resumenDescuentoEl) {
            resumenDescuentoEl.innerText = '-$' + descuentoTransf.toLocaleString('es-AR', {minimumFractionDigits: 2});
        }
        
        const rowDescuentoTransf = document.getElementById('row-descuento-transferencia');
        if (rowDescuentoTransf) {
            if (TRANSFERENCIA_ACTIVA) {
                rowDescuentoTransf.classList.remove('hidden');
            } else {
                rowDescuentoTransf.classList.add('hidden');
            }
        }

        const envioEl = document.getElementById('resumen-envio');
        if (costoEnvio === 0) {
            envioEl.innerText = '¡GRATIS! (Beneficio aplicado)';
            envioEl.className = 'font-bold text-green-600';
        } else {
            envioEl.innerText = '$' + costoEnvio.toLocaleString('es-AR', {minimumFractionDigits: 2});
            envioEl.className = 'font-bold text-mk-deep';
        }

        document.getElementById('resumen-total').innerText = '$' + totalFinal.toLocaleString('es-AR', {minimumFractionDigits: 2});
    }

    function changeQty(index, delta) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let item = cart[index];
        if (!item) return;

        let nuevaCantidad = item.cantidad + delta;

        if (delta > 0 && item.stock !== undefined && nuevaCantidad > item.stock) {
            alert(`No hay suficiente stock. El límite disponible para "${item.nombre}" es de ${item.stock} unidades.`);
            return;
        }

        if (nuevaCantidad <= 0) {
            cart.splice(index, 1);
        } else {
            item.cantidad = nuevaCantidad;
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        if (typeof updateCartCounter === 'function') updateCartCounter();
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        if (typeof updateCartCounter === 'function') updateCartCounter();
    }

    // Interceptamos el envío para soportar QR (MODO) y redirección estándar
    async function prepareCheckout(e) {
        const metodoPago = document.querySelector('input[name="metodo_pago"]:checked').value;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cart_data_input').value = JSON.stringify(cart);
        
        if (cuponAplicado) {
            document.getElementById('cupon_codigo_input').value = cuponAplicado.codigo;
        }

        // Si seleccionó QR / MODO, llamamos al endpoint correspondiente por API en lugar del submit común
        if (metodoPago === 'qr_modo') {
            e.preventDefault(); // Evitamos el submit HTML tradicional
            
            const formData = new FormData(document.getElementById('form-checkout'));
            
            try {
                const res = await fetch('/api/generar-qr-pago', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (res.ok && data.init_point) {
                    localStorage.removeItem('cart');
                    if (typeof updateCartCounter === 'function') updateCartCounter();
                    // Redirige a la pantalla de Mercado Pago donde se muestra el QR para MODO/Billeteras
                    window.location.href = data.init_point;
                } else {
                    alert(data.detail || "Error al generar el código QR de pago.");
                }
            } catch (err) {
                alert("Error de conexión al generar el QR.");
            }
            return;
        }

        // Para los demás métodos (Transferencia y Mercado Pago estándar), limpia el carro y sigue el flujo normal
        localStorage.removeItem('cart');
        if (typeof updateCartCounter === 'function') updateCartCounter();
    }

    document.addEventListener('DOMContentLoaded', loadCart);
</script>
{% endblock %}
