{% extends "base.html" %}

{% block title %}Admin Login | BEAUTY STORE MARY KAY{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-4">
    <div class="bg-gray-950 text-white rounded-3xl p-8 shadow-2xl border border-amber-500/30 relative overflow-hidden space-y-6">
        
        <!-- Efecto de brillo superior -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent pointer-events-none"></div>

        <div class="relative z-10 text-center space-y-2">
            <span class="inline-flex items-center gap-1.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 font-bold text-[10px] uppercase px-3.5 py-1 rounded-full tracking-wider shadow-sm animate-pulse">
                <i class="fa-solid fa-lock text-[10px]"></i> Panel Restringido
            </span>
            <h1 class="font-serif-mk text-2xl sm:text-3xl font-bold text-white">Acceso Administrador</h1>
            <p class="text-xs text-gray-400">Ingresa tus credenciales para gestionar la tienda.</p>
        </div>

        {% if error %}
        <div class="relative z-10 bg-red-950/80 border border-red-500/50 text-red-300 p-3.5 rounded-2xl text-xs font-bold text-center">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="relative z-10 space-y-4">
            <div>
                <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="admin"
                       class="w-full text-xs p-3.5 rounded-xl border border-gray-800 bg-gray-900/80 text-white placeholder-gray-500 focus:bg-gray-900 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none transition shadow-inner">
            </div>

            <div>
                <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full text-xs p-3.5 rounded-xl border border-gray-800 bg-gray-900/80 text-white placeholder-gray-500 focus:bg-gray-900 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none transition shadow-inner">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold text-xs uppercase tracking-wider py-4 rounded-xl transition duration-300 shadow-lg flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
                <span>Ingresar al Panel</span>
            </button>
        </form>

        <div class="relative z-10 text-center pt-2">
            <a href="/" class="text-xs text-gray-400 hover:text-amber-400 transition">&larr; Volver a la Tienda Online</a>
        </div>
    </div>
</div>
{% endblock %}
